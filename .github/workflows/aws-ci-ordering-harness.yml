name: AWS CI Ordering Harness

on:
  pull_request:
    paths:
      - .github/workflows/aws-ci-ordering-harness.yml

permissions:
  contents: read

jobs:
  matrix-prep:
    name: Harness Matrix Prep
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Prepare fixture
        run: echo 'matrix fixture ready'

  lint-success:
    name: Harness Lint Success
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - run: exit 0

  lint-failure:
    name: Harness Lint Failure
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - run: exit 1

  lint-skipped:
    name: Harness Lint Skipped
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - run: exit 0

  shard-after-lint-success:
    name: Harness Shard After Lint Success
    needs: [matrix-prep, lint-success]
    if: ${{ !cancelled() && needs.matrix-prep.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      expensive_marker: ${{ steps.expensive.outputs.marker }}
    steps:
      - name: Fail shard when lint did not succeed
        if: needs.lint-success.result != 'success'
        run: |
          echo 'Lint did not succeed; failing this required Test shard before checkout, authentication, cache access, or dependency installation.'
          exit 1
      - name: Expensive-step marker
        id: expensive
        run: echo 'marker=ran' >> "$GITHUB_OUTPUT"

  shard-after-lint-failure:
    name: Harness Shard After Lint Failure
    needs: [matrix-prep, lint-failure]
    if: ${{ !cancelled() && needs.matrix-prep.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      expensive_marker: ${{ steps.expensive.outputs.marker }}
    steps:
      - name: Fail shard when lint did not succeed
        if: needs.lint-failure.result != 'success'
        run: |
          echo 'Lint did not succeed; failing this required Test shard before checkout, authentication, cache access, or dependency installation.'
          exit 1
      - name: Expensive-step marker
        id: expensive
        run: echo 'marker=ran' >> "$GITHUB_OUTPUT"

  shard-after-lint-skipped:
    name: Harness Shard After Lint Skipped
    needs: [matrix-prep, lint-skipped]
    if: ${{ !cancelled() && needs.matrix-prep.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      expensive_marker: ${{ steps.expensive.outputs.marker }}
    steps:
      - name: Fail shard when lint did not succeed
        if: needs.lint-skipped.result != 'success'
        run: |
          echo 'Lint did not succeed; failing this required Test shard before checkout, authentication, cache access, or dependency installation.'
          exit 1
      - name: Expensive-step marker
        id: expensive
        run: echo 'marker=ran' >> "$GITHUB_OUTPUT"

  verify-fixtures:
    name: Harness Verify Fixture Results
    needs:
      - matrix-prep
      - lint-success
      - lint-failure
      - lint-skipped
      - shard-after-lint-success
      - shard-after-lint-failure
      - shard-after-lint-skipped
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    env:
      MATRIX_PREP: ${{ needs.matrix-prep.result }}
      LINT_SUCCESS: ${{ needs.lint-success.result }}
      LINT_FAILURE: ${{ needs.lint-failure.result }}
      LINT_SKIPPED: ${{ needs.lint-skipped.result }}
      SHARD_SUCCESS: ${{ needs.shard-after-lint-success.result }}
      SHARD_FAILURE: ${{ needs.shard-after-lint-failure.result }}
      SHARD_SKIPPED: ${{ needs.shard-after-lint-skipped.result }}
      SUCCESS_MARKER: ${{ needs.shard-after-lint-success.outputs.expensive_marker }}
      FAILURE_MARKER: ${{ needs.shard-after-lint-failure.outputs.expensive_marker }}
      SKIPPED_MARKER: ${{ needs.shard-after-lint-skipped.outputs.expensive_marker }}
    steps:
      - name: Assert results and expensive-step markers
        shell: bash
        run: |
          set -euo pipefail
          test "$MATRIX_PREP" = success
          test "$LINT_SUCCESS" = success
          test "$LINT_FAILURE" = failure
          test "$LINT_SKIPPED" = skipped
          test "$SHARD_SUCCESS" = success
          test "$SHARD_FAILURE" = failure
          test "$SHARD_SKIPPED" = failure
          test "$SUCCESS_MARKER" = ran
          test -z "$FAILURE_MARKER"
          test -z "$SKIPPED_MARKER"
