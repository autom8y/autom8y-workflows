name: Home-Lab ARM64 Ephemeral Runner Pilot

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/home-lab-runner-pilot.yml'

concurrency:
  group: home-lab-runner-pilot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  arm64-ephemeral-smoke:
    name: Era 3 ARM64 Ephemeral Smoke
    runs-on: [self-hosted, linux, ARM64, home-lab, ephemeral]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Verify Era 3 ARM64 toolchain
        run: |
          uname -a
          test "$(uname -m)" = "aarch64"
          go version
          uv --version
          python3 --version
          shellcheck --version
          jq --version

      - name: Run stdlib lock-source unit tests
        run: python3 -B -S -m unittest -v tests.test_check_lock_sources
