name: "Security: Gitleaks Secrets Scan"

on:
  workflow_call:
    inputs:
      baseline-path:
        description: >-
          Path, relative to the caller repository root, of a gitleaks JSON
          baseline report. Findings listed in it are ignored; any other finding
          fails the job. Generate it with the same gitleaks version and with
          --redact (an unredacted baseline is refused). If the file does not
          exist at the default path, no baseline is used.
        type: string
        required: false
        default: .gitleaks-baseline.json

jobs:
  gitleaks:
    name: Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24)
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C /usr/local/bin gitleaks

      # Exit code is ENFORCING: gitleaks exits 1 on findings (--exit-code default),
      # so this step fails the job.
      # --redact: findings are redacted before they are printed (--verbose), matched
      # against the baseline, or written to the SARIF report. No secret value
      # reaches the log or the report.
      # Baseline: only findings absent from the caller's baseline fail the job.
      # Because matching happens after redaction, the baseline must itself be a
      # redacted report:
      #   gitleaks detect --source . --redact --report-format json \
      #     --report-path .gitleaks-baseline.json
      # A repo-root .gitleaksignore is still auto-discovered as before.
      # Extra rule: the internal service API key format is appended to the scan
      # config (the caller's .gitleaks.toml, or the default config if there is
      # none). Only the runner's checkout is changed; git history is scanned.
      - name: Run gitleaks
        env:
          BASELINE_PATH: ${{ inputs.baseline-path }}
          DEFAULT_BASELINE_PATH: .gitleaks-baseline.json
        run: |
          if ! grep -qs '^id = "autom8y-service-api-key"' .gitleaks.toml; then
            if [ -f .gitleaks.toml ]; then
              echo >> .gitleaks.toml
            else
              printf '[extend]\nuseDefault = true\n' > .gitleaks.toml
            fi
            cat >> .gitleaks.toml <<'EOF'
          [[rules]]
          id = "autom8y-service-api-key"
          description = "Internal service API key"
          regex = '''(?:^|[^A-Za-z0-9_-])(sk_(?:prod|staging|local|dev|test)_[A-Za-z0-9_-]{32,64})(?:[^A-Za-z0-9_-]|$)'''
          secretGroup = 1
          entropy = 3.5
          keywords = ["sk_prod_", "sk_staging_", "sk_local_", "sk_dev_", "sk_test_"]
          EOF
          fi
          args=(detect --source . --redact --report-format sarif --report-path gitleaks-results.sarif --verbose)
          if [ -n "$BASELINE_PATH" ] && [ -f "$BASELINE_PATH" ]; then
            if ! jq -e 'type == "array" and all(.[]; .Secret == "REDACTED")' "$BASELINE_PATH" >/dev/null; then
              echo "::error::Baseline $BASELINE_PATH is not a redacted gitleaks JSON report. Regenerate it with --redact."
              exit 1
            fi
            echo "Using baseline $BASELINE_PATH ($(jq length "$BASELINE_PATH") entries)"
            args+=(--baseline-path "$BASELINE_PATH")
          elif [ -n "$BASELINE_PATH" ] && [ "$BASELINE_PATH" != "$DEFAULT_BASELINE_PATH" ]; then
            echo "::error::Baseline $BASELINE_PATH not found."
            exit 1
          else
            echo "No baseline; every finding fails the job."
          fi
          gitleaks "${args[@]}"

      - name: Upload SARIF
        if: always() && github.event.repository.visibility == 'public'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2 (node24)
        with:
          sarif_file: gitleaks-results.sarif
          category: gitleaks
