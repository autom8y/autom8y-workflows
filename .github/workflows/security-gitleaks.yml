name: "Security: Gitleaks Secrets Scan"

on:
  workflow_call:

jobs:
  gitleaks:
    name: Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24)
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C /usr/local/bin gitleaks

      # Exit code is ENFORCING: gitleaks exits 1 on findings (--exit-code default),
      # so this step fails the job. The `|| true` swallow is retired (DW-COC-03
      # locus (a)) — the delegated check now bites instead of always reporting green.
      # Baseline: no flag needed. gitleaks auto-discovers a repo-root .gitleaksignore
      # (v8.24.3 cmd/root.go:255 via --gitleaks-ignore-path default ".", and :261 via
      # --source). Consumers pinned to an older SHA are unaffected until they re-pin.
      - name: Run gitleaks
        run: gitleaks detect --source . --report-format sarif --report-path gitleaks-results.sarif --redact

      - name: Upload SARIF
        if: always() && github.event.repository.visibility == 'public'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2 (node24)
        with:
          sarif_file: gitleaks-results.sarif
          category: gitleaks
